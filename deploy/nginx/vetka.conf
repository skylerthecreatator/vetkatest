server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vetka-irk.ru www.vetka-irk.ru _;

    client_max_body_size 1m;

    # Existing Telegram automation remains available while its secrets are
    # moved from the prior deployment.
    location /api/ {
        proxy_pass https://vetkatest.vercel.app;
        proxy_http_version 1.1;
        proxy_set_header Host vetkatest.vercel.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
